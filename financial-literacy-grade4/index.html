<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حصّالة المعرفة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
/* Layout: a classroom "money notebook" — header band with coin counter, a scrollable tab rail, one content column (max 1100px); worksheets are styled as printable paper sheets */
:root{
  --paper:#F1F6F2; --card:#FFFFFF; --ink:#16362F; --muted:#5A7069; --line:#D2E1D8;
  --mint:#1D8456; --mint-soft:#DCEFE3; --coin:#C98B06; --coin-bright:#F2B92C; --coin-soft:#FBEFCC;
  --berry:#BC4239; --berry-soft:#F8E1DE; --sky:#2B6CA3; --sky-soft:#DDEAF5; --on-accent:#FFFFFF;
  --f-display:"Lalezar","Readex Pro",Tahoma,system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:14px; --shadow:0 2px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1D1A; --card:#162925; --ink:#E2EEE8; --muted:#9BB3AA; --line:#2A403A;
    --mint:#4CC38A; --mint-soft:#1C3A2E; --coin:#F0B93A; --coin-bright:#F2B92C; --coin-soft:#3A3018;
    --berry:#EF7D73; --berry-soft:#3D2220; --sky:#76AEE0; --sky-soft:#1C2E40; --on-accent:#0F1D1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1D1A; --card:#162925; --ink:#E2EEE8; --muted:#9BB3AA; --line:#2A403A;
  --mint:#4CC38A; --mint-soft:#1C3A2E; --coin:#F0B93A; --coin-bright:#F2B92C; --coin-soft:#3A3018;
  --berry:#EF7D73; --berry-soft:#3D2220; --sky:#76AEE0; --sky-soft:#1C2E40; --on-accent:#0F1D1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.75}
#app{direction:rtl;text-align:right}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
h2{font-size:1.9rem} h3{font-size:1.35rem}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coin-bright);outline-offset:2px;border-radius:8px}

/* header */
.top{background:var(--mint);color:var(--on-accent);position:sticky;top:env(safe-area-inset-top, 0px);z-index:10}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;background:none;border:0;padding:0;text-align:right;color:inherit}
.brand .coinlogo{width:42px;height:42px;flex:none}
.brand h1{font-size:1.7rem;color:inherit}
.brand small{display:block;font-size:.78rem;opacity:.9;font-family:var(--f-body)}
.wallet{display:flex;align-items:center;gap:6px;background:var(--coin-soft);color:var(--ink);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.wallet .c{width:24px;height:24px;border-radius:50%;background:var(--coin-bright);border:2px solid var(--coin);display:grid;place-items:center;font-size:.7rem;color:#5A3E00}
.cur{display:flex;align-items:center;gap:6px;font-size:.85rem}
.cur select{background:var(--card);color:var(--ink);border:0;border-radius:8px;padding:4px 6px}
.rail{background:var(--card);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.rail button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:.9rem}
.rail button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

main .wrap{padding-block:24px 64px;display:grid;gap:24px}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.hero h2{font-size:2.4rem}
.hero p{color:var(--muted);max-width:60ch;margin-top:8px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--mint-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.85rem}
.chip.gold{background:var(--coin-soft)} .chip.red{background:var(--berry-soft)} .chip.blue{background:var(--sky-soft)}
.jar{width:100%;max-width:300px;justify-self:center}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lcard{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:right;transition:transform .15s}
.lcard:hover{transform:translateY(-3px)}
.lnum{width:52px;height:52px;border-radius:50%;background:var(--coin-bright);border:3px solid var(--coin);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;color:#4A3300}
.lcard h3{font-size:1.3rem}
.lcard p{color:var(--muted);font-size:.92rem}
.lcard .tags{display:flex;flex-wrap:wrap;gap:6px}
.lcard .tags .chip{font-size:.75rem}

/* lesson */
.lhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lhead .lnum{width:64px;height:64px;font-size:1.9rem}
.lhead div{min-width:0;flex:1}
.lhead p{color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.subtabs button{border:0;background:none;padding:6px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--mint);color:var(--on-accent)}
.panel{display:grid;gap:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.box h3{margin-bottom:8px}
.goals{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.goals li{padding-right:28px;position:relative}
.goals li::before{content:"";position:absolute;right:4px;top:.6em;width:12px;height:12px;border-radius:50%;background:var(--coin-bright);border:2px solid var(--coin)}

/* flip cards */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.flip{perspective:900px;border:0;background:none;padding:0;min-height:150px;text-align:center}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:grid;place-items:center;padding:14px}
.flip .f{background:var(--mint-soft);border:2px dashed var(--mint)}
.flip .f strong{font-family:var(--f-display);font-size:1.6rem;font-weight:400;display:block}
.flip .f span{font-size:.75rem;color:var(--muted)}
.flip .b{background:var(--card);border:2px solid var(--coin);transform:rotateY(180deg);font-size:.92rem;line-height:1.6}

/* slides */
.deck{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slide{aspect-ratio:16/9;max-width:100%;display:grid;grid-template-columns:1fr 1.6fr;align-items:center;gap:24px;padding:4% 6%;background:linear-gradient(160deg,var(--mint-soft),var(--card) 60%)}
.slide .pic{font-size:clamp(3rem,11vw,8rem);text-align:center;line-height:1.1}
.slide h3{font-size:clamp(1.3rem,3.4vw,2.4rem);margin-bottom:10px}
.slide ul{margin:0;padding-right:20px;display:grid;gap:4px;font-size:clamp(.85rem,1.9vw,1.25rem)}
.slide .tag{display:inline-block;font-size:.8rem;background:var(--coin-soft);border-radius:999px;padding:0 10px;margin-bottom:6px}
.deck:fullscreen{display:grid;place-items:center;background:var(--paper)}
.deck:fullscreen .slide{width:min(100vw,177vh)}
.deckbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.deckbar .dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.deckbar .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.deckbar .dots i.on{background:var(--mint)}
.btn{border:0;border-radius:10px;padding:8px 16px;background:var(--mint);color:var(--on-accent);font-weight:600}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--coin-bright);color:#3B2900}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:.88rem;color:var(--muted);background:var(--sky-soft);border-radius:10px;padding:10px 14px}

/* activity */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.steps{margin:0;padding-right:22px;display:grid;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

/* worksheet = paper */
.sheet{background:#FFFFFF;color:#1B2B27;border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:0 6px 0 -3px var(--line);max-width:820px;width:100%;justify-self:center}
.sheet h3{font-size:1.5rem;color:#1D8456;text-align:center}
.sheet .who{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 18px;font-size:.92rem}
.sheet .who span{flex:1;min-width:140px;border-bottom:1px dotted #8AA39B;padding-bottom:2px}
.sheet section{margin-top:20px}
.sheet h4{margin:0 0 8px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.sheet h4 b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#F2B92C;color:#3B2900;font-size:.85rem;flex:none}
.sheet .row{display:flex;gap:10px;align-items:baseline;padding:4px 0;flex-wrap:wrap}
.sheet .blank{display:inline-block;min-width:90px;border-bottom:1.5px solid #8AA39B;text-align:center}
.sheet .sq{display:inline-grid;place-items:center;width:30px;height:26px;border:1.5px solid #8AA39B;border-radius:5px;flex:none}
.sheet .line{border-bottom:1px solid #B9CCC4;height:30px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .bank{display:flex;flex-wrap:wrap;gap:6px;border:1.5px dashed #8AA39B;border-radius:8px;padding:8px;margin-bottom:10px}
.sheet .bank span{background:#EEF5F0;border-radius:6px;padding:0 8px}
.sheet .bin{border:1.5px solid #8AA39B;border-radius:8px;min-height:120px;padding:6px 10px}
.sheet .bin b{display:block;text-align:center;border-bottom:1px solid #B9CCC4;margin-bottom:4px}
.sheet .drawbox{border:1.5px dashed #8AA39B;border-radius:8px;min-height:140px;padding:6px;font-size:.85rem;color:#5A7069}
.sheet table{width:100%;border-collapse:collapse;font-size:.92rem}
.sheet td,.sheet th{border:1px solid #9DB5AC;padding:6px 8px;text-align:center}
.sheet th{background:#DCEFE3}
.sheet .ans{display:none;color:#BC4239;font-weight:700}
.sheet.key .ans{display:inline}
.sheet .tablewrap{overflow-x:auto}
.sheettools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* games */
.game{display:grid;gap:14px}
.game .instr{color:var(--muted)}
.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:right;font-weight:600}
.tile:hover{border-color:var(--mint)}
.tile.done{background:var(--mint-soft);border-color:var(--mint);cursor:default}
.tile.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.track{display:grid;gap:6px;counter-reset:n}
.track .tile{counter-increment:n;display:flex;gap:10px;align-items:center}
.track .tile::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--coin-bright);color:#3B2900;display:grid;place-items:center;flex:none}
.bigcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;text-align:center;display:grid;gap:12px;justify-items:center}
.bigcard .pic{font-size:3.6rem;line-height:1.1}
.bigcard .q{font-size:1.3rem;font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.choices .btn{min-width:140px;padding:12px 18px;font-size:1.05rem}
.choices .btn.red{background:var(--berry)}
.choices .btn.blue{background:var(--sky)}
.opts{display:grid;gap:8px;width:100%;max-width:560px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:right}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--berry);background:var(--berry-soft)}
.fb{border-radius:12px;padding:10px 14px;width:100%;max-width:560px;text-align:right}
.fb.ok{background:var(--mint-soft)} .fb.no{background:var(--berry-soft)}
.bar{height:16px;border-radius:999px;background:var(--line);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--mint);transition:width .4s}
.bar.over i{background:var(--berry)}
.blist{display:grid;gap:8px}
.bitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.bitem input{width:22px;height:22px;accent-color:var(--mint);flex:none}
.bitem label{flex:1;min-width:0;cursor:pointer}
.bitem .p{font-variant-numeric:tabular-nums;font-weight:700}
.sim{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.sjar{position:relative;width:160px;height:200px;border:4px solid var(--ink);border-top-width:10px;border-radius:24px 24px 34px 34px;overflow:hidden;justify-self:center;background:var(--card)}
.sjar i{position:absolute;bottom:0;left:0;right:0;background:repeating-linear-gradient(0deg,var(--coin-bright) 0 12px,var(--coin) 12px 14px);transition:height .5s}
.sjar b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem;color:var(--ink);text-shadow:0 0 6px var(--card)}
.log{display:grid;gap:4px;font-size:.9rem;max-height:180px;overflow:auto}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{min-height:110px;border-radius:12px;border:2px solid var(--line);background:var(--mint);color:var(--on-accent);font-family:var(--f-display);font-size:2rem;padding:8px}
.mcard.open{background:var(--card);color:var(--ink);font-family:var(--f-body);font-size:.85rem;line-height:1.45}
.mcard.open.t{font-family:var(--f-display);font-size:1.3rem}
.mcard.got{background:var(--mint-soft);color:var(--ink);border-color:var(--mint);font-family:var(--f-body);font-size:.85rem}
.mcard.got.t{font-family:var(--f-display);font-size:1.3rem}

/* riddles */
.riddles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.riddle{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.riddle .q{font-size:1.05rem}
.riddle .q::before{content:"؟";font-family:var(--f-display);font-size:1.8rem;color:var(--coin);float:right;margin-left:10px;line-height:1}
.riddle .a{background:var(--coin-soft);border-radius:10px;padding:8px 12px;font-weight:700}
.riddle .h{font-size:.88rem;color:var(--muted)}
.riddle .acts{display:flex;gap:8px;flex-wrap:wrap}

/* glossary & guide */
.gloss{display:grid;gap:8px}
.gloss .g{display:grid;grid-template-columns:170px 1fr auto;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.gloss .g b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;color:var(--mint)}
.gloss .g span{min-width:0}
.gloss input{width:100%;max-width:420px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.tw{overflow-x:auto}
table.plan{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:.93rem}
table.plan th,table.plan td{border-bottom:1px solid var(--line);padding:10px;text-align:right;vertical-align:top}
table.plan th{background:var(--mint-soft)}
.toast{position:fixed;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:600;z-index:50;transition:opacity .3s,transform .3s}
.toast[hidden]{display:none!important}

@media (max-width:760px){
  .hero,.cols,.sim{grid-template-columns:1fr}
  .slide{grid-template-columns:1fr;aspect-ratio:auto;gap:8px;padding:20px}
  .slide .pic{font-size:3.4rem}
  .gloss .g{grid-template-columns:1fr}
  .mem{grid-template-columns:repeat(3,1fr)}
  .sheet{padding:18px 16px}
  .sheet .grid2{grid-template-columns:1fr}
  h2{font-size:1.6rem} .hero h2{font-size:1.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.rail,.subtabs,.lhead,.sheettools,.toast,.noprint{display:none!important}
  body,html{background:#fff}
  main .wrap{padding:0}
  .sheet{border:0;box-shadow:none;max-width:none;padding:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <button class="brand" id="homeBtn" aria-label="الصفحة الرئيسية">
        <svg class="coinlogo" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#F2B92C" stroke="#C98B06" stroke-width="4"/><circle cx="24" cy="24" r="14" fill="none" stroke="#C98B06" stroke-width="2" stroke-dasharray="3 3"/><text x="24" y="31" text-anchor="middle" font-size="18" font-family="Lalezar, sans-serif" fill="#5A3E00">ح</text></svg>
        <span><h1>حصّالة المعرفة</h1><small>سلسلة دروس الإدارة المالية · الصف الرابع</small></span>
      </button>
      <label class="cur">العملة
        <select id="curSel">
          <option value="شيكل">شيكل ₪</option>
          <option value="دينار">دينار</option>
          <option value="درهم">درهم</option>
          <option value="ريال">ريال</option>
          <option value="جنيه">جنيه</option>
          <option value="ليرة">ليرة</option>
        </select>
      </label>
      <div class="wallet" title="القطع الذهبية التي جمعتها في الألعاب"><span class="c">$</span><span id="coins">0</span> قطعة ذهبية</div>
    </div>
  </header>
  <nav class="rail" aria-label="التنقل"><div class="wrap" id="rail"></div></nav>
  <main><div class="wrap" id="view"></div></main>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';

/* ======================= المحتوى ======================= */
const LESSONS = [
{
  id:1, title:'رحلة المال', sub:'من المقايضة إلى البطاقة البنكية',
  intro:'كيف كان الناس يشترون قبل اختراع النقود؟ نسافر عبر الزمن ونكتشف لماذا اخترع الإنسان المال.',
  goals:['أن يعرّف الطالب المال ويذكر وظائفه الثلاث.','أن يشرح المقايضة ويذكر صعوبتين فيها.','أن يرتّب مراحل تطوّر المال من الأقدم إلى الأحدث.','أن يميّز بين السلعة والخدمة.'],
  terms:[
    ['المال','كل شيء يتفق الناس على استخدامه لشراء السلع والخدمات.'],
    ['المقايضة','تبادل سلعة بسلعة أو خدمة بخدمة دون استخدام المال.'],
    ['العملة المعدنية','قطعة نقود صغيرة مصنوعة من المعدن.'],
    ['الورقة النقدية','نقود مطبوعة على ورق خاص يصعب تزويره.'],
    ['البطاقة البنكية','بطاقة ندفع بها من حسابنا في البنك دون حمل نقود.'],
    ['السلعة','شيء نلمسه ونشتريه، مثل التفاحة والقلم والحذاء.'],
    ['الخدمة','عمل يقوم به شخص من أجلنا، مثل قصّ الشعر وعلاج الطبيب.']

const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem('hasala-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('hasala-'+k,JSON.stringify(v))}catch(e){}}
};
let CUR = store.get('cur','شيكل');
let COINS = store.get('coins',0);
const C = s => String(s).split('{c}').join(CUR);
const shuffle = (arr,seed) => {
  const a = arr.slice(); let s = seed ?? Math.floor(Math.random()*1e9);
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  for (let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
};
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

let state = {view:'home',lesson:1,tab:'terms'};
const TABS = [['terms','الأهداف والمصطلحات'],['slides','العارضة'],['activity','الفعالية'],['sheet','ورقة العمل'],['games','الألعاب'],['riddles','الحزازير']];
function parseHash(){
  const h = location.hash.replace('#','');
  const m = h.match(/^lesson([1-6])(?:-(\w+))?$/);
  if (m){state={view:'lesson',lesson:+m[1],tab:TABS.some(t=>t[0]===m[2])?m[2]:'terms'};return}
  if (['glossary','arcade','guide','final'].includes(h)){state={view:h};return}
  state={view:'home'};
}
function go(view,lesson,tab){
  const h = view==='lesson' ? 'lesson'+lesson+'-'+(tab||'terms') : (view==='home'?'':view);
  try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}
  if(view==='lesson')state={view,lesson,tab:tab||'terms'};else state={view};
  render(); window.scrollTo({top:0});
}

function renderRail(){
  const items = [['home','الرئيسية']].concat(LESSONS.map(l=>['lesson'+l.id,'الدرس '+l.id])).concat([['final','مشروع الختام'],['glossary','القاموس'],['arcade','ساحة الألعاب'],['guide','دليل المعلّم']]);
  const cur = state.view==='lesson' ? 'lesson'+state.lesson : state.view;
  $('#rail').innerHTML = items.map(([k,t])=>`<button data-k="${k}" aria-current="${k===cur}">${t}</button>`).join('');
  $('#rail').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; if(k.startsWith('lesson'))go('lesson',+k.slice(6));else go(k);
  });
}

function render(){
  renderRail();
  const v=$('#view');
  if(state.view==='lesson')return renderLesson(v);
  if(state.view==='glossary')return renderGlossary(v);
  if(state.view==='arcade')return renderArcade(v);
  if(state.view==='guide')return renderGuide(v);
  if(state.view==='final')return renderFinal(v);
  renderHome(v);
}

}

/* ورقة العمل */
function wsSection(s,n,seed){
  const head=`<h4><b>${n}</b>${C(s.title)}</h4>`;
  if(s.type==='match'){
    const right=s.pairs.map(p=>p[0]); const left=shuffle(s.pairs.map((p,k)=>[p[1],k+1]),seed);
    return head+`<p style="font-size:.88rem">اكتب رقم المصطلح في المربّع المناسب.</p><div class="grid2"><div>${right.map((t,k)=>`<div class="row"><b>${k+1}.</b> ${t}</div>`).join('')}</div><div>${left.map(([d,k])=>`<div class="row"><span class="sq"><span class="ans">${k}</span></span> ${C(d)}</div>`).join('')}</div></div>`;
  }
  if(s.type==='order'){
    const it=shuffle(s.items.map((t,k)=>[t,k+1]),seed);
    return head+it.map(([t,k])=>`<div class="row"><span class="sq"><span class="ans">${k}</span></span> ${C(t)}</div>`).join('');
  }
  if(s.type==='tf') return head+s.items.map(([t,ok])=>`<div class="row"><span class="sq"><span class="ans">${ok?'✓':'✗'}</span></span> ${C(t)}</div>`).join('');
  if(s.type==='calc') return head+s.items.map(([q,a],k)=>`<div class="row"><b>${['أ','ب','ج','د','هـ'][k]})</b> ${C(q)}</div><div class="row">الحلّ: <span class="blank" style="flex:1"><span class="ans">${C(a)}</span></span></div>`).join('');
  if(s.type==='classify'){
    const it=shuffle(s.items,seed);
    return head+`<div class="bank">${it.map(x=>`<span>${x[0]}</span>`).join('')}</div><div class="grid2">${s.cols.map((c,k)=>`<div class="bin"><b>${c}</b><span class="ans">${s.items.filter(x=>x[1]===k).map(x=>x[0]).join('، ')}</span></div>`).join('')}</div>`;
  }
  if(s.type==='fill') return head+`<div class="bank">${shuffle(s.bank,seed).map(b=>`<span>${b}</span>`).join('')}</div>`+s.items.map(([a,ans,b])=>`<div class="row">${a}<span class="blank"><span class="ans">${ans}</span></span>${b}</div>`).join('');
  if(s.type==='open') return head+Array.from({length:s.lines||3},()=>'<div class="line"></div>').join('');
  if(s.type==='draw') return head+`<div class="grid2">${s.boxes.map(b=>`<div class="drawbox">${b}</div>`).join('')}</div>`;
  if(s.type==='table') return head+`<div class="tablewrap"><table><thead><tr>${s.head.map(h=>`<th>${C(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c?C(c):'&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${s.ans?`<p class="ans" style="font-size:.88rem;margin-top:6px">${C(s.ans)}</p>`:''}`;
  return '';
}

/* ======================= محرّكات الألعاب ======================= */
function mountGame(el,g){({order:gOrder,sort:gSort,quiz:gQuiz,budget:gBudget,savings:gSavings,memory:gMemory})[g.type](el,g)}

function gOrder(el,g){
  let next=0; const items=shuffle(g.items.map((t,k)=>[t,k]));
  el.innerHTML=`<h3>${g.title}</h3><p class="instr">${g.instr}</p><div class="track" id="tr"></div><div class="pool" id="pl"></div><div><button class="btn ghost" data-r>العب من جديد</button></div>`;
  const pl=el.querySelector('#pl'),tr=el.querySelector('#tr');
  pl.innerHTML=items.map(([t,k])=>`<button class="tile" data-k="${k}">${C(t)}</button>`).join('');
  pl.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(+b.dataset.k===next){b.classList.add('done');tr.appendChild(b);b.onclick=null;next++;
      if(next===g.items.length){addCoins(5,'أحسنت! رتّبتها كلها.');tr.insertAdjacentHTML('afterend','<div class="fb ok">ممتاز! هذه هي رحلة المال من الماضي إلى اليوم.</div>')}}
    else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad')}
  });
  el.querySelector('[data-r]').onclick=()=>gOrder(el,g);
}

function gSort(el,g){
  const items=shuffle(g.items); let i=0,score=0;
  const draw=()=>{
    if(i>=items.length){
      el.innerHTML=`<h3>${g.title}</h3><div class="bigcard"><div class="pic">🏆</div><p class="q">النتيجة: ${score} من ${items.length}</p><p>${score===items.length?'علامة كاملة! أنت خبير.':'جيد! جرّب مرة أخرى لتحصل على العلامة الكاملة.'}</p><button class="btn" data-r>العب من جديد</button></div>`;
      el.querySelector('[data-r]').onclick=()=>gSort(el,g);return;
    }
    const [pic,t,b,why]=items[i];
    el.innerHTML=`<h3>${g.title}</h3><p class="instr">${g.instr}</p><div class="score"><span class="chip">بطاقة ${i+1} من ${items.length}</span><span class="chip gold">صحيح: ${score}</span></div>
      <div class="bigcard"><div class="pic">${pic}</div><p class="q">${C(t)}</p>
      <div class="choices">${g.bins.map((n,k)=>`<button class="btn ${k?'red':''}" data-b="${k}">${n}</button>`).join('')}</div><div id="fb"></div></div>`;
    el.querySelectorAll('[data-b]').forEach(btn=>btn.onclick=()=>{
      const ok=+btn.dataset.b===b; if(ok){score++;addCoins(1)}
      el.querySelectorAll('[data-b]').forEach(x=>x.disabled=true);
      el.querySelector('#fb').outerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'صحيح! ':'ليس تمامًا. الجواب: '+g.bins[b]+'. '}${why?C(why):''}</div><button class="btn gold" data-n>التالي ←</button>`;
      el.querySelector('[data-n]').onclick=()=>{i++;draw()};
    });
  };
  draw();
}

function gQuiz(el,g){
  let i=0,score=0;
  const draw=()=>{
    if(i>=g.qs.length){
      el.innerHTML=`<h3>${g.title}</h3><div class="bigcard"><div class="pic">${score===g.qs.length?'🏆':'⭐'}</div><p class="q">النتيجة: ${score} من ${g.qs.length}</p><button class="btn" data-r>العب من جديد</button></div>`;
      el.querySelector('[data-r]').onclick=()=>gQuiz(el,g);return;
    }
    const q=g.qs[i];
    el.innerHTML=`<h3>${g.title}</h3><p class="instr">${C(g.instr||'')}</p><div class="score"><span class="chip">سؤال ${i+1} من ${g.qs.length}</span><span class="chip gold">صحيح: ${score}</span></div>
      <div class="bigcard"><p class="q">${C(q.q)}</p><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-o="${k}">${C(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
    el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.o, ok=k===q.a; if(ok){score++;addCoins(1)}
      el.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(+x.dataset.o===q.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      el.querySelector('#fb').outerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'إجابة صحيحة! ':'انتبه: '}${q.ex?C(q.ex):''}</div><button class="btn gold" data-n>${i===g.qs.length-1?'النتيجة':'التالي ←'}</button>`;
      el.querySelector('[data-n]').onclick=()=>{i++;draw()};
    });
  };
  draw();
}

function gBudget(el,g){
  const kindName={need:['حاجة',''],want:['رغبة','red'],save:['ادّخار','gold'],share:['مشاركة','blue']};
  el.innerHTML=`<h3>${g.title}</h3><p class="instr">${C(g.instr)}</p>
    <div class="score"><span class="chip">الدخل: ${g.income} ${CUR}</span><span class="chip gold" id="spent">المصروفات: 0</span><span class="chip" id="left">الباقي: ${g.income}</span></div>
    <div class="bar" id="bar"><i style="width:0%"></i></div>
    <div class="blist">${g.items.map(([pic,n,pr,k],i)=>`<div class="bitem"><input type="checkbox" id="bi${i}" data-i="${i}"><label for="bi${i}">${pic} ${n} <span class="chip ${kindName[k][1]}" style="font-size:.72rem">${kindName[k][0]}</span></label><span class="p">${pr} ${CUR}</span></div>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="chk">افحص ميزانيتي</button><button class="btn ghost" id="rst">ابدأ من جديد</button></div><div id="bfb"></div>`;
  let rewarded=false;
  const sel=()=>[...el.querySelectorAll('input:checked')].map(x=>g.items[+x.dataset.i]);
  const upd=()=>{
    const s=sel().reduce((a,x)=>a+x[2],0), left=g.income-s;
    el.querySelector('#spent').textContent='المصروفات: '+s+' '+CUR;
    el.querySelector('#left').textContent=(left>=0?'الباقي: ':'عجز: ')+Math.abs(left)+' '+CUR;
    el.querySelector('#left').className='chip '+(left>=0?'':'red');
    const bar=el.querySelector('#bar'); bar.classList.toggle('over',left<0); bar.querySelector('i').style.width=Math.min(100,s/g.income*100)+'%';
  };
  el.querySelectorAll('input').forEach(x=>x.onchange=upd);
  el.querySelector('#rst').onclick=()=>gBudget(el,g);
  el.querySelector('#chk').onclick=()=>{
    const s=sel(), total=s.reduce((a,x)=>a+x[2],0), left=g.income-total;
    const needs=g.items.filter(x=>x[3]==='need'), missing=needs.filter(n=>!s.includes(n)), saved=s.some(x=>x[3]==='save');
    const msgs=[]; let ok=true;
    if(left<0){ok=false;msgs.push(`عندك عجز ${-left} ${CUR}. احذف بعض الرغبات.`)}
    if(missing.length){ok=false;msgs.push('نسيت حاجة مهمة: '+missing.map(m=>m[1]).join('، ')+'.')}
    if(!saved){ok=false;msgs.push('لم تدّخر شيئًا لهدفك. تذكّر: ادّخر أولًا!')}
    if(ok){msgs.push(`ميزانية ممتازة! غطّيت الحاجات وادّخرت${left>0?' وبقي معك فائض '+left+' '+CUR:''}.`);if(s.some(x=>x[3]==='share'))msgs.push('ورائع أنك فكّرت في صديقك أيضًا 🎁');if(!rewarded){rewarded=true;addCoins(5,'ميزانية ناجحة!')}}
    el.querySelector('#bfb').innerHTML=`<div class="fb ${ok?'ok':'no'}" style="max-width:none">${msgs.join('<br>')}</div>`;
  };
}

function gSavings(el,g){
  el.innerHTML=`<h3>${g.title}</h3><p class="instr">${g.instr}</p>
    <div class="box" style="display:grid;gap:12px"><b>1. اختر هدفك:</b><div class="choices" style="justify-content:flex-start">${g.goals.map(([p,n,pr],k)=>`<button class="btn ghost" data-g="${k}">${p} ${n} – ${pr} ${CUR}</button>`).join('')}</div>
    <b>2. كم ستدّخر كل أسبوع؟</b><div class="choices" style="justify-content:flex-start">${g.weekly.map(w=>`<button class="btn ghost" data-w="${w}">${w} ${CUR}</button>`).join('')}</div>
    <div><button class="btn" id="start" disabled>ابدأ الادخار</button></div></div>`;
  let goal=null,weekly=null;
  const ready=()=>el.querySelector('#start').disabled=!(goal&&weekly);
  el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{goal=g.goals[+b.dataset.g];el.querySelectorAll('[data-g]').forEach(x=>x.className='btn ghost');b.className='btn';ready()});
  el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{weekly=+b.dataset.w;el.querySelectorAll('[data-w]').forEach(x=>x.className='btn ghost');b.className='btn';ready()});
  el.querySelector('#start').onclick=()=>run();
  function run(){
    let saved=0,week=0,spentOnTemptations=0; const log=[]; const ev=shuffle(g.events); const ideal=Math.ceil(goal[2]/weekly);
    const draw=(event)=>{
      const pct=Math.min(100,saved/goal[2]*100);
      el.innerHTML=`<h3>${g.title}: ${goal[0]} ${goal[1]}</h3>
        <div class="sim"><div class="sjar"><i style="height:${pct}%"></i><b>${saved} / ${goal[2]}</b></div>
        <div style="display:grid;gap:12px;min-width:0"><div class="score"><span class="chip">الأسبوع: ${week}</span><span class="chip gold">ادّخرت: ${saved} ${CUR}</span><span class="chip blue">أدّخر أسبوعيًا: ${weekly} ${CUR}</span></div>
        <div id="evbox"></div><div class="log">${log.slice().reverse().map(l=>`<span>${l}</span>`).join('')}</div></div></div>`;
      const box=el.querySelector('#evbox');
      if(saved>=goal[2]){
        const msg = week<=ideal ? 'رائع! وصلت في أسرع وقت ممكن لأنك قاومت الإغراءات.' : `وصلت بعد ${week} أسابيع. لو قاومت الإغراءات لوصلت في ${ideal} أسابيع فقط، وكنت ستوفّر ${spentOnTemptations} ${CUR}.`;
        box.innerHTML=`<div class="fb ok" style="max-width:none">🎉 مبروك! اشتريت ${goal[1]}. ${msg}</div><button class="btn" id="again">العب من جديد</button>`;
        addCoins(5,'وصلت إلى هدفك!');
        box.querySelector('#again').onclick=()=>gSavings(el,g);return;
      }
      if(!event){box.innerHTML=`<button class="btn gold" id="nw">الأسبوع التالي ←</button>`;box.querySelector('#nw').onclick=nextWeek;return}
      if(event.cost){
        box.innerHTML=`<div class="bigcard" style="padding:14px"><div class="pic" style="font-size:2.4rem">${event.pic}</div><p>${event.t} السعر: ${event.cost} ${CUR}. هل تشتري من مدّخراتك؟</p><div class="choices"><button class="btn red" id="buy">نعم، أشتري</button><button class="btn" id="skip">لا، أكمل الادخار</button></div></div>`;
        box.querySelector('#buy').onclick=()=>{const c=Math.min(event.cost,saved);saved-=c;spentOnTemptations+=c;log.push(`الأسبوع ${week}: اشتريت (${event.pic}) بـ ${c} ${CUR}.`);draw(null)};
        box.querySelector('#skip').onclick=()=>{log.push(`الأسبوع ${week}: قاومت الإغراء ${event.pic} 💪`);draw(null)};
      } else {
        if(event.gift){saved+=event.gift;log.push(`الأسبوع ${week}: ${event.t} +${event.gift} ${CUR}`)} else log.push(`الأسبوع ${week}: ${event.t}`);
        draw(null);
      }
    };
    function nextWeek(){week++;saved+=weekly;log.push(`الأسبوع ${week}: وضعت ${weekly} ${CUR} في الحصّالة.`);draw(ev[(week-1)%ev.length])}
    draw(null);
  }
}

function gMemory(el){
  const all=LESSONS.flatMap(l=>l.terms); const pick=shuffle(all).slice(0,6);
  const cards=shuffle(pick.flatMap((p,k)=>[{k,t:p[0],term:true},{k,t:C(p[1]),term:false}]));
  let open=[],found=0,tries=0,lock=false;
  el.innerHTML=`<h3>لعبة الذاكرة: المصطلح ومعناه</h3><p class="instr">اقلب بطاقتين: ابحث عن المصطلح ومعناه.</p><div class="score"><span class="chip" id="mt">المحاولات: 0</span><span class="chip gold" id="mf">الأزواج: 0 / 6</span></div><div class="mem">${cards.map((c,i)=>`<button class="mcard" data-i="${i}" aria-label="بطاقة ${i+1}">؟</button>`).join('')}</div><div><button class="btn ghost" data-r>لعبة جديدة</button></div>`;
  el.querySelector('[data-r]').onclick=()=>gMemory(el);
  el.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.i]; if(lock||b.classList.contains('open')||b.classList.contains('got'))return;
    b.classList.add('open');if(c.term)b.classList.add('t');b.textContent=c.t;open.push([b,c]);
    if(open.length===2){tries++;el.querySelector('#mt').textContent='المحاولات: '+tries;
      const [[b1,c1],[b2,c2]]=open;
      if(c1.k===c2.k){[b1,b2].forEach(x=>{x.classList.remove('open');x.classList.add('got')});found++;open=[];el.querySelector('#mf').textContent='الأزواج: '+found+' / 6';
        if(found===6)addCoins(5,'وجدت كل الأزواج!')}
      else{lock=true;setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('open','t');x.textContent='؟'});open=[];lock=false},1100)}
    }
  });
}
